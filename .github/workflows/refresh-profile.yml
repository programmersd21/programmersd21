name: Refresh profile

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"
  push:
    branches:
      - main
    paths:
      - .github/scripts/update_stats.mjs
      - .github/workflows/refresh-profile.yml

permissions:
  contents: write

concurrency:
  group: refresh-profile
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Update project statistics
        env:
          GITHUB_TOKEN: \${{ secrets.GITHUB_TOKEN }}
        run: node .github/scripts/update_stats.mjs
      - name: Commit updated profile
        run: |
          if git diff --quiet -- profile.svg; then
            echo "Profile metrics are unchanged."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile.svg
          git commit -m "chore: refresh live profile metrics"
          git push
