name: Update profile repository statistics

on:
  push:
    paths:
      - ".github/workflows/update-stars.yml"
      - ".github/scripts/update_stats.mjs"
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-profile-repository-stats
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out profile repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Set up Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - name: Fetch and update repository statistics
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node .github/scripts/update_stats.mjs
      - name: Commit updated showcase SVG
        env:
          BRANCH_NAME: ${{ github.ref_name }}
        run: |
          if git diff --quiet -- showcase.svg; then
            echo "Repository statistics are already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add showcase.svg
          git commit -m "chore: update repository stars and forks"
          git pull --rebase origin "$BRANCH_NAME"
          git push origin "HEAD:$BRANCH_NAME"
