  <text x="720" y="142" class="mono eyebrow" fill="#8a8a93">projects</text>
  <text x="720" y="202" class="serif" font-size="50" fill="#f5f5f4">06</text>
  <text x="844" y="142" class="mono eyebrow" fill="#8a8a93">stars</text>
  <text x="844" y="202" class="serif" font-size="50" fill="#f5f5f4" data-total-stars="true">931</text>
  <line x1="720" y1="226" x2="948" y2="226" class="rule"/>
  <text x="720" y="263" class="mono eyebrow" fill="#8a8a93">forks</text>
  <text x="844" y="265" class="mono" font-size="18" font-weight="500" fill="#f5f5f4" data-total-forks="true">30</text>
  <text x="720" y="320" class="mono" font-size="9" letter-spacing=".7px" fill="#71717a">live repository totals</text>
</g>

<line x1="52" y1="384" x2="948" y2="384" stroke="url(#hero-rule)"/>

<g class="sans">
  <text x="52" y="420" class="mono eyebrow" fill="#8a8a93">02 — currently building</text>
  <text x="948" y="420" class="mono eyebrow" text-anchor="end" fill="#71717a">ratatui ecosystem / agent tooling</text>
</g>

<g>
  <rect x="52" y="446" width="896" height="190" rx="6" fill="#101113" stroke="#303136"/>
  <line x1="625" y1="468" x2="625" y2="614" stroke="#303136"/>
  <text x="78" y="480" class="mono eyebrow" fill="#a1a1aa">ratatui-skill / agent skill</text>
  <text x="76" y="535" class="serif" font-size="43" fill="#f5f5f4">terminal interfaces,</text>
  <text x="76" y="580" class="serif" font-size="43" font-style="italic" fill="#f5f5f4">built to hold up.</text>
  <text x="80" y="610" class="mono" font-size="9" letter-spacing=".8px" fill="#8a8a93" data-star-count="ratatui-skill">15</text>
  <text x="105" y="610" class="mono" font-size="9" letter-spacing=".8px" fill="#71717a">stars</text>
  <text x="154" y="610" class="mono" font-size="9" letter-spacing=".8px" fill="#8a8a93" data-fork-count="ratatui-skill">0 forks</text>
  <a xlink:href="https://github.com/programmersd21/ratatui-skill" target="_blank">
    <text x="596" y="610" class="mono" font-size="9" text-anchor="end" fill="#a1a1aa">explore ↗</text>
  </a>
</g>

<g clip-path="url(#figure-clip)">
  <g opacity=".34" stroke="#34363b" stroke-width="1" fill="none">
    <path d="M670 424H920 M670 454H920 M670 484H920 M670 514H920 M670 544H920"/>
    <path d="M700 390V560 M730 390V560 M760 390V560 M790 390V560 M820 390V560 M850 390V560 M880 390V560 M910 390V560"/>
