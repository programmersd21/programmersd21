  </g>
  <g class="figure" stroke="#d4d4d8" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <circle cx="790" cy="434" r="13"/>
    <path d="M790 448L790 490"/>
    <path d="M790 459L770 476"/>
    <g class="arm"><path d="M790 459L813 476L825 492"/></g>
    <path d="M790 490L775 519L760 536"/>
    <path d="M790 490L807 518L820 536"/>
