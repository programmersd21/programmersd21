    <text x="76" y="790" class="sans project-name">flow</text>
    <text x="76" y="818" class="sans project-copy">a focused network throughput monitor for the terminal.</text>
    <text x="76" y="843" class="mono project-meta"><tspan data-star-count="flow">466</tspan><tspan dx="7">stars</tspan><tspan dx="14" data-fork-count="flow">13 forks</tspan></text>
