<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1000" height="1320" viewBox="0 0 1000 1320" role="img" aria-labelledby="title desc">
<title id="title">soumalya — independent software builder</title>
<desc id="desc">A dark, monochrome portfolio featuring open-source software projects, live GitHub statistics, and a small animated line-art figure working at a terminal.</desc>
<defs>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&amp;family=Instrument+Serif:ital@0;1&amp;family=Inter:wght@400;450;500;550;600;650&amp;display=swap');
    :root {
      --bg: #08090a;
      --surface: #101113;
      --surface-raised: #151719;
      --text: #f5f5f4;
      --text-secondary: #a1a1aa;
      --text-muted: #71717a;
      --text-subtle: #52525b;
      --border: #252629;
      --border-soft: #1b1c1f;
      --line: #303136;
    }
    text { text-rendering: geometricPrecision; }
    .sans { font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    .serif { font-family: "Instrument Serif", Georgia, "Times New Roman", serif; }
    .mono { font-family: "Geist Mono", "SFMono-Regular", Consolas, monospace; }
    .eyebrow { font-size: 10px; font-weight: 500; letter-spacing: 1.55px; }
    .muted { fill: var(--text-secondary); }
    .subtle { fill: var(--text-muted); }
    .rule { stroke: var(--border); stroke-width: 1; }
    .card { fill: var(--surface); stroke: var(--border); stroke-width: 1; transition: fill 220ms ease, stroke 220ms ease, transform 320ms cubic-bezier(.2,.8,.2,1); transform-box: fill-box; transform-origin: center; }
    .project:hover .card { fill: var(--surface-raised); stroke: #45464c; }
    .project:hover .arrow { fill: var(--text); transform: translate(2px,-2px); }
    .project:hover .project-name { fill: #ffffff; }
    .project-name { font-size: 22px; font-weight: 550; letter-spacing: -.7px; fill: var(--text); transition: fill 180ms ease; }
    .project-copy { font-size: 13px; fill: var(--text-secondary); }
    .project-meta { font-size: 9px; letter-spacing: .9px; fill: var(--text-muted); }
    .arrow { font-family: Inter, sans-serif; font-size: 15px; fill: var(--text-muted); transition: transform 180ms ease, fill 180ms ease; }
    .figure { animation: float 5s ease-in-out infinite; transform-origin: 790px 475px; }
    .arm { animation: type 1.8s ease-in-out infinite; transform-origin: 792px 490px; }
    .cursor-blink { animation: blink 1.1s steps(2, start) infinite; }
    .orbit { animation: orbit 14s linear infinite; transform-origin: 806px 444px; }
    @keyframes float { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-4px); } }
    @keyframes type { 0%,100% { transform: rotate(0deg); } 50% { transform: rotate(-3deg); } }
    @keyframes blink { 0%,48% { opacity: 1; } 49%,100% { opacity: 0; } }
    @keyframes orbit { to { transform: rotate(360deg); } }
    @media (prefers-reduced-motion: reduce) {
      .figure, .arm, .cursor-blink, .orbit { animation: none; }
      .card, .arrow, .project-name { transition: none; }
    }
  </style>
  <linearGradient id="hero-rule" x1="0" x2="1"><stop offset="0" stop-color="#34353a"/><stop offset="1" stop-color="#17181a"/></linearGradient>
  <clipPath id="figure-clip"><rect x="670" y="390" width="250" height="170" rx="2"/></clipPath>
</defs>

<rect width="1000" height="1320" fill="#08090a"/>
<path d="M52 0V1320 M948 0V1320" stroke="#ffffff" stroke-opacity=".018"/>

<g class="sans">
  <text x="52" y="48" font-size="13" font-weight="650" letter-spacing="1.3" fill="#f5f5f4">soumalya</text>
  <circle cx="137" cy="43" r="2" fill="#71717a"/>
  <text x="150" y="47" class="mono eyebrow" fill="#8a8a93">independent software builder</text>
  <a xlink:href="https://github.com/programmersd21" target="_blank">
    <text x="948" y="47" class="mono eyebrow" text-anchor="end" fill="#a1a1aa">github ↗</text>
  </a>
</g>
<line x1="52" y1="72" x2="948" y2="72" class="rule"/>

<g class="sans">
  <text x="52" y="116" class="mono eyebrow" fill="#8a8a93">01 — selected work / open source</text>
</g>
<g>
  <text x="46" y="205" class="serif" font-size="82" letter-spacing="-1.8" fill="#f5f5f4">software,</text>
  <text x="46" y="276" class="serif" font-size="82" font-style="italic" letter-spacing="-1.8" fill="#f5f5f4">made with intent.</text>
  <text x="52" y="320" class="sans" font-size="15" fill="#a1a1aa">building tools for terminals, systems, and the people who use them.</text>
  <text x="52" y="345" class="sans" font-size="15" fill="#a1a1aa">mostly rust, go, and python. always learning by building.</text>
</g>

<g>
  <line x1="700" y1="112" x2="948" y2="112" class="rule"/>
  <line x1="700" y1="112" x2="700" y2="344" class="rule"/>
